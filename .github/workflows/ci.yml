name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout fzf-tab test dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Aloxaf/fzf-tab
          ref: 24105b15714bfec37989ed5c5b6e60f572253019
          path: .fzf-tab-test

      - name: Setup tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Install zsh
        run: sudo apt-get install --yes zsh

      - run: FZF_TAB_TEST_DIR="$PWD/.fzf-tab-test" just check
